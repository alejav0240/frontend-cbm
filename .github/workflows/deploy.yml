name: Frontend DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.2.2"

jobs:
  fast-checks:
    name: "Phase 1 - Quality and secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type-check TypeScript
        run: pnpm exec tsc --noEmit

  build:
    name: "Build prerequisite - Next.js"
    runs-on: ubuntu-24.04
    needs: fast-checks
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload standalone build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-standalone
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: "Phase 4 - Browser tests"
    runs-on: ubuntu-24.04
    needs: fast-checks
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify E2E environment
        run: |
          set -euo pipefail
          test -n "$PLAYWRIGHT_BASE_URL" || { echo "::error::Missing E2E_BASE_URL repository variable"; exit 1; }
          test -n "$E2E_ADMIN_USER" || { echo "::error::Missing E2E_ADMIN_USER secret"; exit 1; }
          test -n "$E2E_ADMIN_PASSWORD" || { echo "::error::Missing E2E_ADMIN_PASSWORD secret"; exit 1; }

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E suite
        working-directory: test/e2e
        run: pnpm exec playwright test --config=playwright.config.ts --project=chromium

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  dependency-security:
    name: "Phase 3 - Dependency security"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Scan source tree with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          cache: "false"
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          format: sarif
          output: trivy-frontend-filesystem.sarif
          exit-code: "1"

      - name: Show Trivy findings when the scan fails
        if: ${{ failure() }}
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table

      - name: Upload Trivy filesystem report
        if: ${{ always() && hashFiles('trivy-frontend-filesystem.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-filesystem.sarif

      - name: Upload security artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-trivy-filesystem
          path: trivy-frontend-filesystem.sarif
          if-no-files-found: ignore
          retention-days: 30

  sast:
    name: "Phase 2 - CodeQL SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  sonar:
    name: "Phase 5 - SonarQube"
    runs-on: ubuntu-24.04
    needs: [fast-checks, e2e]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN" || { echo "::error::Missing SONAR_TOKEN secret"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "::error::Missing SONAR_HOST_URL repository variable"; exit 1; }

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  container-security:
    name: "Phase 6 - Docker build and image scan"
    runs-on: ubuntu-24.04
    needs: [build, dependency-security]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cbm-frontend:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          cache: "false"
          image-ref: cbm-frontend:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          format: sarif
          output: trivy-frontend-image.sarif
          exit-code: "1"

      - name: Upload Docker image scan
        if: ${{ always() && hashFiles('trivy-frontend-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-image.sarif

      - name: Upload Docker security artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-trivy-image
          path: trivy-frontend-image.sarif
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    name: "Phase 7 - Deploy staging"
    runs-on: ubuntu-24.04
    needs: [build, e2e, dependency-security, sast, sonar, container-security]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.build.result == 'success' &&
        needs.e2e.result == 'success' &&
        needs.dependency-security.result == 'success' &&
        needs.sast.result == 'success' &&
        needs.sonar.result == 'success' &&
        needs.container-security.result == 'success'
      }}
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy staging
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$DEPLOY_PATH"
          test -n "$STAGING_URL"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" <<'DEPLOY_EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
          pnpm install --frozen-lockfile
          pnpm build
          test -d .next/standalone
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          pm2 restart cbm-frontend-staging
          pm2 save
          DEPLOY_EOF
          curl --fail --show-error --silent --retry 10 --retry-delay 5 \
            "$STAGING_URL/login"

  dast:
    name: "Phase 8 - OWASP ZAP baseline"
    runs-on: ubuntu-24.04
    needs: deploy-staging
    if: ${{ needs.deploy-staging.result == 'success' }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: true
          cmd_options: "-I"
          artifact_name: frontend-zap-report

  performance:
    name: "Phase 9 - k6 smoke load test"
    runs-on: ubuntu-24.04
    needs: deploy-staging
    if: ${{ needs.deploy-staging.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.4.0"

      - name: Run k6 smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: k6 run test/performance/frontend-smoke.js

  deploy:
    name: "Phase 10 - Deploy frontend"
    runs-on: ubuntu-24.04
    needs: [deploy-staging, dast, performance]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.deploy-staging.result == 'success' &&
        needs.dast.result == 'success' &&
        needs.performance.result == 'success'
      }}
    environment: production
    timeout-minutes: 20
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'echo SSH connection OK'

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'DEPLOY_EOF'
          set -euo pipefail
          cd ~/cbm-frontend
          git fetch origin main
          git reset --hard origin/main
          pnpm install --frozen-lockfile
          pnpm build
          test -d .next/standalone || { echo "ERROR: standalone output missing"; exit 1; }
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          pm2 restart cbm-frontend
          pm2 save
          DEPLOY_EOF

      - name: Verify deployed health endpoint
        if: ${{ vars.FRONTEND_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.FRONTEND_HEALTHCHECK_URL }}
        run: curl --fail --show-error --silent --retry 10 --retry-delay 5 "$HEALTHCHECK_URL"
