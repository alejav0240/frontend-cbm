name: Frontend DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.2.2"

jobs:
  fast-checks:
    name: "Phase 1 - Quality and secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type-check TypeScript
        run: pnpm exec tsc --noEmit

  build:
    name: "Phase 2 - Next.js build"
    runs-on: ubuntu-24.04
    needs: fast-checks
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload standalone build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-standalone
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: error
          retention-days: 7

  dependency-security:
    name: "Phase 3 - Dependency security"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Scan source tree with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-frontend-filesystem.sarif
          exit-code: "1"

      - name: Show Trivy findings when the scan fails
        if: ${{ failure() }}
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table

      - name: Upload Trivy filesystem report
        if: ${{ always() && hashFiles('trivy-frontend-filesystem.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-filesystem.sarif

      - name: Upload security artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-trivy-filesystem
          path: trivy-frontend-filesystem.sarif
          if-no-files-found: ignore
          retention-days: 30

  sast:
    name: "Phase 4 - CodeQL SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  deploy:
    name: "Phase 5 - Deploy frontend"
    runs-on: ubuntu-24.04
    needs: [build, dependency-security, sast]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.build.result == 'success' &&
        needs.dependency-security.result == 'success' &&
        needs.sast.result == 'success'
      }}
    environment: production
    timeout-minutes: 20
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'echo SSH connection OK'

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'DEPLOY_EOF'
          set -euo pipefail
          cd ~/cbm-frontend
          git fetch origin main
          git reset --hard origin/main
          pnpm install --frozen-lockfile
          pnpm build
          test -d .next/standalone || { echo "ERROR: standalone output missing"; exit 1; }
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          pm2 restart cbm-frontend
          pm2 save
          DEPLOY_EOF

      - name: Verify deployed health endpoint
        if: ${{ vars.FRONTEND_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.FRONTEND_HEALTHCHECK_URL }}
        run: curl --fail --show-error --silent --retry 10 --retry-delay 5 "$HEALTHCHECK_URL"
